    const DB_NAME = "EdgeGuardVerificationDB";
    const DB_VERSION = 1;
    const STORE_NAME = "verification_state";

    function openIndexedDb() {
      return new Promise((resolve, reject) => {
        if (!window.indexedDB) {
          resolve(null);
          return;
        }
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME);
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => resolve(null);
      });
    }

    async function loadFromIndexedDb() {
      try {
        const db = await openIndexedDb();
        if (!db) return null;
        return new Promise((resolve) => {
          const tx = db.transaction(STORE_NAME, "readonly");
          const store = tx.objectStore(STORE_NAME);
          const req = store.get("current_state");
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => resolve(null);
        });
      } catch (e) {
        return null;
      }
    }

    async function saveToIndexedDb(state) {
      try {
        const db = await openIndexedDb();
        if (!db) return;
        const tx = db.transaction(STORE_NAME, "readwrite");
        const store = tx.objectStore(STORE_NAME);
        store.put(state, "current_state");
      } catch (e) {}
    }

    function getSavedState() {
      try {
        const data = localStorage.getItem('edgeguard_scam_verification');
        if (data) {
          const parsed = JSON.parse(data);
          inMemoryState = Object.assign({}, inMemoryState, parsed);
        }
      } catch (e) {}
      return inMemoryState;
    }

    function saveState(state) {
      inMemoryState = state;
      try {
        localStorage.setItem('edgeguard_scam_verification', JSON.stringify(state));
      } catch (e) {}
      saveToIndexedDb(state);
      showSavedToast("Saved to Local Storage & IndexedDB");
    }

        toast.classList.remove('hidden');
        clearTimeout(window._toastTimeout);
        window._toastTimeout = setTimeout(() => {
          toast.classList.add('hidden');
        }, 2500);
      }
    }

    }

    function resetAll() {
      if (confirm('Are you sure you want to reset all verification checkboxes back to empty?')) {
        inMemoryState = { _notes: {} };
        try { localStorage.removeItem('edgeguard_scam_verification'); } catch(e) {}
        saveToIndexedDb(inMemoryState);
        render();
        showSavedToast("All checkboxes reset");
      }
    }

    // EXPORT JSON FILE TO DISK
    function exportJsonFile() {
      const state = getSavedState();
      state.lastExported = new Date().toISOString();
      const jsonString = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", jsonString);
      downloadAnchor.setAttribute("download", "edgeguard_test_progress.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
      showSavedToast("Downloaded edgeguard_test_progress.json");
    }

    // IMPORT JSON FILE FROM DISK
    function importJsonFile(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          inMemoryState = Object.assign({}, inMemoryState, imported);
          saveState(inMemoryState);
          render();
          showSavedToast("Successfully imported " + file.name);
        } catch (err) {
          alert("Invalid JSON progress file.");
        }
      };
      reader.readAsText(file);
    }

    // DOWNLOAD SELF-CONTAINED HTML (Hardcoded with current state)
    function downloadSelfContainedHtml() {
      const state = getSavedState();
      let htmlContent = document.documentElement.outerHTML;
      // Replace the BAKED_IN_VERIFIED_DEFAULTS in the exported file
      const stateString = JSON.stringify(state, null, 2);
      htmlContent = htmlContent.replace(
        /const BAKED_IN_VERIFIED_DEFAULTS = \{[\s\S]*?\};/,
        `const BAKED_IN_VERIFIED_DEFAULTS = ${stateString};`
      );
      const blob = new Blob([htmlContent], { type: "text/html;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = "EdgeGuard_Scam_Verification_Form.html";
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      showSavedToast("Downloaded self-contained HTML copy!");
    }

    function copyToClipboard(text, btnElement) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => showCopiedFeedback(btnElement));
      } else {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        showCopiedFeedback(btnElement);
      }
    }

    function showCopiedFeedback(btnElement) {
      const originalText = btnElement.innerText;
      btnElement.innerText = "✓ Copied!";
      btnElement.classList.add("bg-emerald-600", "text-white");
      setTimeout(() => {
        btnElement.innerText = originalText;
        btnElement.classList.remove("bg-emerald-600", "text-white");
      }, 1500);
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.remove('bg-slate-900', 'text-white');
        btn.classList.add('bg-white', 'text-slate-700');
      });
      const activeBtn = document.getElementById('btn-' + filter);
      if (activeBtn) {
        activeBtn.classList.remove('bg-white', 'text-slate-700');
        activeBtn.classList.add('bg-slate-900', 'text-white');
      }
      render();
    }

    function render() {
      const state = getSavedState();
      const notes = state._notes || {};

      let verifiedCount = 0;
      SCAMS_DATABASE.forEach(s => {
        if (state[s.id]) verifiedCount++;
      });

      const totalCount = SCAMS_DATABASE.length;
      const pendingCount = totalCount - verifiedCount;
      const rate = Math.round((verifiedCount / totalCount) * 100);

      document.getElementById('statTotal').innerText = totalCount;
      document.getElementById('statVerified').innerText = verifiedCount;
      document.getElementById('statPending').innerText = pendingCount;
      document.getElementById('statRate').innerText = rate + '%';
      document.getElementById('progressBar').style.width = rate + '%';

      const container = document.getElementById('scamsContainer');
      container.innerHTML = '';

      const filtered = SCAMS_DATABASE.filter(s => {
        const isVerified = !!state[s.id];
        if (currentFilter === 'all') return true;
        if (currentFilter === 'verified') return isVerified;
        if (currentFilter === 'pending') return !isVerified;
        return s.category === currentFilter;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="bg-white border border-slate-200 rounded-2xl p-12 text-center text-slate-400">
            No scams match the current filter.
          </div>
        `;
        return;
      }

      filtered.forEach((scam) => {
        const isChecked = !!state[scam.id];
        const userNote = notes[scam.id] || '';

        const card = document.createElement('div');
        card.className = `border rounded-2xl p-5 md:p-6 transition-all duration-200 shadow-sm ${
          isChecked 
            ? 'bg-emerald-50/70 border-emerald-400 ring-1 ring-emerald-300' 
            : 'bg-white border-slate-200 hover:border-slate-300'
        }`;

        let sevColor = "bg-rose-100 text-rose-700";
        if (scam.severity === "Warning") sevColor = "bg-amber-100 text-amber-700";
        if (scam.severity === "Info") sevColor = "bg-sky-100 text-sky-700";

        card.innerHTML = `
          <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div class="flex items-start gap-3">
              <button type="button" onclick="toggleVerification('${scam.id}')" 
                class="clickable w-7 h-7 mt-0.5 rounded-lg flex items-center justify-center border font-bold text-sm ${
                  isChecked 
                    ? 'bg-emerald-600 text-white border-emerald-600 shadow-sm' 
                    : 'bg-white text-transparent border-slate-300 hover:border-slate-400'
                }">
                ✓
              </button>
              <div>
                <div class="flex flex-wrap items-center gap-2">
                  <h3 onclick="toggleVerification('${scam.id}')" class="clickable text-base md:text-lg font-bold text-slate-900 ${isChecked ? 'line-through text-slate-500' : ''}">${scam.name}</h3>
                  <span class="badge ${sevColor}">${scam.severity}</span>
                  <span class="badge bg-slate-100 text-slate-600">${scam.categoryName}</span>
                  <button type="button" onclick="toggleVerification('${scam.id}')" class="clickable badge ${
                    isChecked 
                      ? 'bg-emerald-600 text-white hover:bg-emerald-700' 
                      : 'bg-amber-100 text-amber-800 border border-amber-300 hover:bg-amber-200'
                  }">
                    ${isChecked ? '✓ Verified Detected' : '⏳ Pending Test — Click to Verify'}
                  </button>
                </div>
                <p class="text-xs text-slate-500 mt-1 font-mono">Expected Alert: <span class="font-semibold text-slate-700">${scam.alertTitle}</span></p>
              </div>
            </div>
            <div class="flex-shrink-0">
              <button type="button" onclick="toggleVerification('${scam.id}')" class="clickable text-xs font-bold px-4 py-2 rounded-xl border shadow-sm transition ${
                isChecked 
                  ? 'bg-emerald-600 text-white border-emerald-600 hover:bg-emerald-700' 
                  : 'bg-white text-slate-700 border-slate-300 hover:bg-slate-50 hover:border-slate-400'
              }">
                ${isChecked ? '✓ Verified on Phone' : 'Mark as Detected'}
              </button>
            </div>
          </div>

          <div class="mt-4 pt-4 border-t border-slate-100 grid md:grid-cols-2 gap-4 text-xs">
            <div class="space-y-1">
              <span class="font-bold text-slate-700 uppercase tracking-wider text-[11px]">How EdgeGuard Detects It:</span>
              <p class="text-slate-600 leading-relaxed">${scam.detectionRule}</p>
            </div>
            <div class="space-y-1">
              <span class="font-bold text-slate-700 uppercase tracking-wider text-[11px]">How To Test on Phone:</span>
              <p class="text-slate-600 leading-relaxed">${scam.testSteps}</p>
            </div>
          </div>

          ${scam.sampleText ? `
            <div class="mt-3 bg-slate-50 border border-slate-200 rounded-xl p-3 flex flex-col md:flex-row md:items-center justify-between gap-3 text-xs">
              <div class="overflow-hidden">
                <span class="font-semibold text-slate-500 block mb-0.5">Test Message Sample:</span>
                <code class="text-slate-800 break-words font-mono select-all bg-white px-2 py-1 rounded border border-slate-200 block">${scam.sampleText}</code>
              </div>
              <button type="button" onclick="copyToClipboard('${scam.sampleText.replace(/'/g, "\\'")}', this)" class="clickable flex-shrink-0 px-3 py-1.5 bg-indigo-50 text-indigo-700 border border-indigo-200 hover:bg-indigo-100 rounded-lg font-semibold transition">
                Copy Test Text
              </button>
            </div>
          ` : ''}

          <div class="mt-3">
            <input type="text" placeholder="Add test notes (e.g. 'Alert popped up in 0.1s on WhatsApp test')..." 
              value="${userNote.replace(/"/g, '&quot;')}"
              onchange="saveNotes('${scam.id}', this.value)"
              class="w-full text-xs px-3 py-2 bg-white border border-slate-200 rounded-lg text-slate-700 focus:outline-none focus:ring-1 focus:ring-indigo-500">
          </div>
        `;

        container.appendChild(card);
      });
    }

    // Initialize with IndexedDB load if available
    loadFromIndexedDb().then((dbState) => {
      if (dbState) {
        inMemoryState = Object.assign({}, inMemoryState, dbState);
      }
      render();
    });
  </script>
</body>
</html>
